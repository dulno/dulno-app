<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dulno">

  <!-- Favicon -->
  <link rel="icon" class="dulno-icon" href="icons/icon-dark.ico" type="image/x-icon" sizes="144x144">

  <title>Dulno</title>
  <link rel="manifest" href="manifest.json">

  <script>
    const updateIcon = (event) => {
      var iconElements = document.getElementsByClassName("dulno-icon");
      for (var i = 0; i < iconElements.length; i++) {
        if (event.matches) {
          iconElements[i].href = "icons/icon-light.ico";
        } else {
          iconElements[i].href = "icons/icon-dark.ico";
        }
      }
    };

    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    window.addEventListener('DOMContentLoaded', () => updateIcon(mediaQuery));
    mediaQuery.addEventListener('change', updateIcon);
  </script>


  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">








  <style id="splash-screen-style">
    html, body {
     height: 100%;
     margin: 0;
   }

   #loader {
     position: absolute;
     top: 50%; left: 50%;
     transform: translate(-50%, -50%);
     text-align: center;
     width: 200px;
     transition: opacity 0.5s ease;
   }

   .progress-track {
     position: relative;
     width: 100%;
     height: 6px;
     background: #eee;
     overflow: hidden;
     border-radius: 3px;
     margin-top: 25px;
     margin-bottom: 8px;
   }

   .progress-bar {
     position: absolute;
     top: 0;
     left: 0;
     width: 50%;
     height: 100%;
     background: #007AFF;
     animation: slide-back-forth 2s ease-in-out infinite;
   }

   @keyframes slide-back-forth {
     0%   { left: 0; }
     50%  { left: 50%; }
     100% { left: 0; }
   }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>

<div id="loader">
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
</div>





  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
