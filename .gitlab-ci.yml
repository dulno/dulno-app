stages:
  - build
  - merge

build_android:
  stage: build
  image: instrumentisto/flutter:3.29.0-androidsdk34-r0
  before_script:
    - echo $ANDROID_KEYSTORE_CONTENT | base64 -d > android/app/keystore.jks
  script:
    - yes | flutter doctor --android-licenses || true
    - flutter pub run flutter_native_splash:create
    - flutter build appbundle --release
    - mv build/app/outputs/bundle/release/app-release.aab android/dulno.aab
  artifacts:
    paths:
      - android/dulno.aab
    expire_in: 1 day

merge:
  stage: merge
  image: curlimages/curl:latest
  script:
    - |
      curl --request POST --header "PRIVATE-TOKEN: $DULNO_GITLAB_PRIVATE_TOKEN" \
      --data "source_branch=dev&target_branch=main&title=Production deployment" \
      --data "remove_source_branch=false&squash=true" \
      "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  only:
    - dev
  when: on_success